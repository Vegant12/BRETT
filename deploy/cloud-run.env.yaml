# The complete non-secret runtime environment for the Cloud Run service (DEPLOY-01).
#
# This is the render.yaml `envVars` analog and the reason the deploy stays testable:
# `gcloud run deploy --env-vars-file` reads a flat YAML mapping, so a unit test can
# parse it and cross-check every key against the model that consumes it.
#
# Credentials are bound separately by --set-secrets in scripts/deploy-cloud-run.sh
# and must never appear here. A name bound in both places is rejected by Cloud Run,
# and a credential written into this file would be in git history forever (T-02-10).
#
# gcloud replaces the service's ENTIRE environment from this file on every deploy
# ("All existing environment variables will be removed before the new environment
# variables are added"), so this is the whole environment, not a patch.
ENVIRONMENT: "production"
LOG_LEVEL: "INFO"

# Host allowlist for the MCP transport's DNS-rebinding guard. Cloud Run forwards
# the ORIGINAL public Host header to the container, so this must name the real
# hostname or every request answers `421 Invalid Host header` with no MCP-level
# error body (T-02-01). Comma-separated: Cloud Run assigns both a deterministic
# and a legacy hash URL, and serves both.
#
# 792870654598 is the real GCP project number for project `brett-fitness`, filled in
# by plan 02-05. It was knowable before the first deploy because Cloud Run's
# deterministic URL is https://SERVICE-PROJECT_NUMBER.REGION.run.app.
MCP_ALLOWED_HOSTS: "brett-792870654598.us-central1.run.app,brett-cglno6k2xq-uc.a.run.app"

# Must match, character for character, the URL typed into Claude's "Add custom
# connector" dialog and the Resource Indicator registered at the IdP. No trailing
# slash, no query string.
MCP_RESOURCE_URL: "https://brett-792870654598.us-central1.run.app/mcp"

# `authkit` = validate WorkOS-issued RS256 JWTs against the tenant JWKS below,
# enforcing iss, exp and an aud equal to MCP_RESOURCE_URL. Flipped here by plan
# 02-07; the D-01 Claude Code CLI proof that justified the earlier constant-time
# bearer mode completed against Stage A in plan 02-05 and is now discharged.
#
# Rollback is one value plus a redeploy, never a code change: set this back to
# `static` and re-run ./scripts/deploy-cloud-run.sh. The constant-time compare
# and the brett-mcp-auth-secret binding both remain in place precisely so a
# WorkOS outage stays a configuration problem (T-02-07).
#
# Both URLs below were READ from
# https://quiet-fireplace-16-staging.authkit.app/.well-known/oauth-authorization-server
# in plan 02-06 and recorded verbatim in 02-06-SUMMARY.md -- neither is derived
# from convention, because a silently changed WorkOS path is a total auth outage.
# They are deliberately NOT credentials: both surface in the RFC 9728 metadata
# document Claude fetches anonymously, which is why backend/app/config.py keeps
# them out of `_SECRET_FIELDS`. Issuer carries no trailing slash.
MCP_AUTH_MODE: "static"
MCP_ISSUER_URL: "https://quiet-fireplace-16-staging.authkit.app"
MCP_JWKS_URI: "https://quiet-fireplace-16-staging.authkit.app/oauth2/jwks"

# Rate limiting (ROADMAP Phase 7 criterion #2). Present here rather than left on
# the code defaults so the numbers can be retuned with a redeploy instead of a
# commit to backend/app/config.py. Quoted because --env-vars-file requires a flat
# KEY: "value" string mapping and gcloud rejects a bare integer.
#
# Per-INSTANCE, and scripts/deploy-cloud-run.sh deploys with --max=2, so the
# service-wide ceiling is up to 2x these values.
RATE_LIMIT_PER_MINUTE: "30"
RATE_LIMIT_BURST: "30"

# The complete non-secret runtime environment for the Hevy sync Cloud Run JOB (D-10).
#
# Deliberately NOT deploy/cloud-run.env.yaml. `--env-vars-file` replaces the target's
# ENTIRE environment, so the two workloads cannot share a file and differ by one key,
# and the job needs PYTHONPATH while the service does not (uvicorn reaches `app` via
# --app-dir backend instead).
#
# Credentials are bound separately by --set-secrets in scripts/deploy-sync-job.sh and
# must never appear here. Enforced by backend/tests/test_sync_job_deploy.py.
#
# No MCP_* key is set: every one has a default on Settings, the CLI never builds the
# MCP app, and a job carrying the auth configuration would be a second place to keep
# those values in sync.
ENVIRONMENT: "production"
LOG_LEVEL: "INFO"

# `backend/` is the import root: `app` is not an installed distribution, which is why
# the Procfile's web process passes `--app-dir backend`. `python -m app.cli` has no
# equivalent flag, so the path comes from the environment. NOT a Settings field --
# backend/tests/test_sync_job_deploy.py allowlists it explicitly as a runtime var.
PYTHONPATH: "backend"

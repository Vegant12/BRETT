# Local development database only.
#
# NOTE ON THE PASSWORD BELOW: `brett_local_dev` is a LOCAL DEV ONLY throwaway
# credential for a container bound to localhost. It is NOT a secret, it is not
# used in any deployed environment, and it is intentionally committed so that
# `docker compose up -d db` works out of the box. Gitleaks triage: not a leak.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: brett
      POSTGRES_PASSWORD: brett_local_dev
      POSTGRES_DB: brett
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ REFUSES to start with the mount at `/var/lib/postgresql/data`
      # ("Error: in 18+, these Docker images are configured to store database data
      # in a format which is compatible with pg_ctlcluster"). 18 stores data in a
      # major-version subdirectory, so the mount belongs one level up.
      - brett_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brett -d brett"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  brett_pgdata:
